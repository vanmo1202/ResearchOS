name: Production readiness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: researchos
          POSTGRES_DB: researchos_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U researchos -d researchos_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: researchos
      PGDATABASE: researchos_test_ci
      RESEARCH_LOAD_ENV: 'false'
      MOCK_LLM: 'true'
      MOCK_SEARCH: 'true'
      GEMINI_API_KEY: fake-ci-never-live
      TAVILY_API_KEY: fake-ci-never-live
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci 2>&1 | tee backend-install.log
        working-directory: backend
      - name: Full backend tests (per-file schema isolation)
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/ci/offline-providers.cjs
        run: npm test 2>&1 | tee backend-tests.log
        working-directory: backend
      - run: npm audit --omit=dev 2>&1 | tee backend-audit.log
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-failure-logs
          path: backend/backend-*.log
          retention-days: 7
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEARCH_LOAD_ENV: 'false'
      MOCK_LLM: 'true'
      MOCK_SEARCH: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci 2>&1 | tee backend-install.log
        working-directory: backend
      - run: npm ci 2>&1 | tee frontend-install.log
        working-directory: frontend
      - run: npm run format:check 2>&1 | tee frontend-format.log
        working-directory: frontend
      - run: npm run build 2>&1 | tee frontend-build.log
        working-directory: frontend
      - id: browser
        run: npx playwright install --with-deps chrome 2>&1 | tee frontend-browser.log
        working-directory: frontend
      - name: Complete WF01 rebuild suite (all responsive tests)
        run: npm run test:rebuild -- --reporter=list,html --output=test-results/rebuild 2>&1 | tee frontend-rebuild.log
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/rebuild
      - name: Complete unified chat suite
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npx playwright test -c playwright.unified.config.js --reporter=list,html --output=test-results/unified 2>&1 | tee frontend-unified.log
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/unified
      - name: Complete analytics suite
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npx playwright test -c playwright.analytics.config.js --reporter=list,html --output=test-results/analytics 2>&1 | tee frontend-analytics.log
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/analytics
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-failure-logs-and-reports
          path: |
            backend/backend-install.log
            frontend/frontend-*.log
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
  compose:
    name: Docker build and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose and worker image with isolated placeholders
        run: python3 scripts/ci/validate-compose.py 2>&1 | tee compose-validation.log
      - uses: docker/setup-buildx-action@v3
      - name: Build actual local backend and frontend contexts
        run: |
          docker buildx build --progress=plain --load --tag researchos-ci/backend:local --file backend/Dockerfile backend 2>&1 | tee docker-backend.log
          docker buildx build --progress=plain --load --tag researchos-ci/frontend:local --file frontend/Dockerfile --build-arg VITE_API_BASE_URL= frontend 2>&1 | tee docker-frontend.log
      - name: Build hardened backend and frontend Dockerfiles
        run: |
          docker buildx build --progress=plain --load --tag researchos-ci/backend:hardened --file deploy/Dockerfile.backend backend 2>&1 | tee docker-hardened-backend.log
          docker buildx build --progress=plain --load --tag researchos-ci/frontend:hardened --file deploy/Dockerfile.frontend frontend 2>&1 | tee docker-hardened-frontend.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-failure-logs
          path: |
            compose-validation.log
            docker-*.log
          retention-days: 7
  operations:
    name: Automation and operations safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: gpg --version
      - name: Local automation behavior in disposable Git repositories
        run: python3 -m unittest discover -s scripts/dev/tests -v 2>&1 | tee automation-tests.log
      - run: python3 -m unittest discover -s scripts/ops -p 'test_*.py' -v 2>&1 | tee operations-tests.log
      - name: Shell syntax and Vietnam calendar
        run: |
          bash -n scripts/dev/daily-commit.sh scripts/dev/safe-push.sh scripts/dev/git-guard.sh
          systemd-analyze calendar '*-*-* 20:30:00 Asia/Ho_Chi_Minh'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: automation-failure-logs
          path: |
            automation-tests.log
            operations-tests.log
          retention-days: 7
  summary:
    name: Required validation summary
    if: always()
    needs: [backend, frontend, compose, operations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      DOCKER_RESULT: ${{ needs.compose.result }}
      OPERATIONS_RESULT: ${{ needs.operations.result }}
    steps:
      - name: Report and reject any unsuccessful required job
        run: |
          printf '## ResearchOS validation\n\n| Job | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for name in BACKEND FRONTEND DOCKER OPERATIONS; do
            variable="${name}_RESULT"
            result=${!variable}
            printf '| %s | %s |\n' "$name" "$result" >> "$GITHUB_STEP_SUMMARY"
            [[ "$result" == success ]] || failed=1
          done
          printf '\nImages are built only. No registry publication or VPS deployment.\n' >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
